<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10090d">
<title>for you</title>
<style>
* { box-sizing: border-box; }

html { scroll-padding-top: env(safe-area-inset-top, 0px); }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: #10090d;
  color: #fff0f5;
  font-family: Inter, Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  overflow-x: hidden;
}

main {
  position: relative;
  z-index: 1;
  width: min(90%, 520px);
  padding: 35px 20px;
}

h1 {
  font-family: Georgia, serif;
  font-size: clamp(38px, 9vw, 58px);
  margin-bottom: 12px;
}

h1:focus { outline: none; }

p {
  color: #d9bac7;
  line-height: 1.7;
}

.portada {
  display: block;
  width: min(300px, 80%);
  height: auto;
  margin: 0 auto 24px;
  border-radius: 18px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
}

#photos {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  width: min(94vw, 600px);
  position: relative;
  left: 50%;
  transform: translateX(-50%);
  margin-bottom: 14px;
}

.galeria {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 14px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
}

.hanako {
  width: min(220px, 65%);
  max-height: 230px;
  object-fit: contain;
  margin-bottom: 20px;
}

button {
  border: 0;
  border-radius: 30px;
  padding: 13px 25px;
  margin: 9px;
  font-size: 16px;
  font-family: inherit;
  cursor: pointer;
  transition: transform 0.15s ease, filter 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}

button:hover { filter: brightness(1.08); }
button:active { transform: scale(0.97); }

button:focus-visible,
input:focus-visible,
textarea:focus-visible {
  outline: 2px solid #f3b6cf;
  outline-offset: 3px;
}

.yes {
  background: #eaa6c1;
  color: #260f1b;
}

.no {
  background: #39232e;
  color: white;
}

.buttons {
  padding: 30px 0;
}

#yesButton {
  position: relative;
  overflow: hidden;
  animation: glow 2s ease-in-out infinite;
}

#yesButton::after {
  content: "";
  position: absolute;
  top: 0;
  left: -60%;
  width: 40%;
  height: 100%;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.55), transparent);
  transform: skewX(-20deg);
  pointer-events: none;
  animation: shine 3s ease-in-out infinite;
}

@keyframes glow {
  0%, 100% {
    box-shadow: 0 0 8px rgba(243, 182, 207, 0.45), 0 0 18px rgba(243, 182, 207, 0.25);
  }
  50% {
    box-shadow: 0 0 18px rgba(243, 182, 207, 0.9), 0 0 38px rgba(234, 166, 193, 0.55);
  }
}

@keyframes shine {
  0% { left: -60%; }
  60%, 100% { left: 130%; }
}

.yes, .no {
  transition: transform 0.4s ease, filter 0.15s ease;
}

footer {
  margin-top: 35px;
  font-size: 10px;
  letter-spacing: 2px;
  color: #a88796;
}

.hidden { display: none; }

#celebration h1 {
  color: #f3b6cf;
}

#dateChoice {
  margin-top: 35px;
}

input {
  display: block;
  width: 100%;
  margin: 12px 0;
  padding: 13px;
  border: 1px solid #75465d;
  border-radius: 12px;
  background: #21121b;
  color: white;
  color-scheme: dark;
  font-family: inherit;
  font-size: 16px;
}

textarea {
  display: block;
  width: 100%;
  min-height: 90px;
  margin: 12px 0;
  padding: 13px;
  border: 1px solid #75465d;
  border-radius: 12px;
  background: #21121b;
  color: white;
  color-scheme: dark;
  font-family: inherit;
  font-size: 16px;
  resize: vertical;
}

#message {
  color: #f3b6cf;
  min-height: 25px;
}

#hearts {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
  background: radial-gradient(ellipse at 50% 0%, rgba(120, 40, 80, 0.35), transparent 65%);
}

.heart {
  position: absolute;
  top: 0;
  opacity: 0;
  text-shadow: 0 0 10px rgba(243, 182, 207, 0.6);
  will-change: transform, opacity;
  animation: heartFall linear infinite;
}

.petal {
  position: absolute;
  top: 0;
  opacity: 0;
  border-radius: 100% 0 100% 0;
  background: linear-gradient(135deg, #ffe3ee 0%, #f3b6cf 55%, #d77ca5 100%);
  box-shadow: 0 0 8px rgba(243, 182, 207, 0.35);
  will-change: transform, opacity;
  animation: petalFall linear infinite;
}

@keyframes petalFall {
  0% {
    transform: translate3d(0, -10vh, 0) rotate(0deg) rotateX(0deg);
    opacity: 0;
  }
  8% { opacity: var(--o, 0.8); }
  25% {
    transform: translate3d(var(--sway, 60px), 24vh, 0) rotate(110deg) rotateX(70deg);
  }
  50% {
    transform: translate3d(calc(var(--sway, 60px) * -0.7), 50vh, 0) rotate(220deg) rotateX(0deg);
  }
  75% {
    transform: translate3d(calc(var(--sway, 60px) * 0.9), 80vh, 0) rotate(330deg) rotateX(70deg);
  }
  92% { opacity: var(--o, 0.8); }
  100% {
    transform: translate3d(calc(var(--sway, 60px) * -1), 112vh, 0) rotate(440deg) rotateX(0deg);
    opacity: 0;
  }
}

@keyframes petalDrift {
  0% {
    transform: translate3d(0, -10vh, 0);
    opacity: 0;
  }
  8% { opacity: var(--o, 0.8); }
  92% { opacity: var(--o, 0.8); }
  100% {
    transform: translate3d(calc(var(--sway, 60px) * -0.5), 112vh, 0);
    opacity: 0;
  }
}

@keyframes heartFall {
  0% {
    transform: translate3d(0, -10vh, 0) rotate(0deg);
    opacity: 0;
  }
  10% { opacity: var(--o, 0.5); }
  50% {
    transform: translate3d(var(--sway, 30px), 55vh, 0) rotate(20deg);
  }
  90% { opacity: var(--o, 0.5); }
  100% {
    transform: translate3d(calc(var(--sway, 30px) * -1), 112vh, 0) rotate(-20deg);
    opacity: 0;
  }
}

.confetti {
  position: fixed;
  top: -15px;
  width: 9px;
  height: 13px;
  animation: fall 3s linear forwards;
  pointer-events: none;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(720deg);
    opacity: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  button, .yes, .no { transition: none; }
  #yesButton::after { animation: none; }
  #yesButton { box-shadow: 0 0 16px rgba(243, 182, 207, 0.6); }
  .heart, .petal { animation-name: petalDrift; }
}
</style>
</head>

<script>
"use strict";

// Fondo romántico: corazones que caen despacio
(function () {
  const box = document.getElementById("hearts");
  const colors = ["#f3b6cf", "#eaa6c1", "#d77ca5", "#ffd6e7"];
  const total = window.innerWidth < 600 ? 8 : 14;

  for (let i = 0; i < total; i++) {
    const h = document.createElement("span");
    h.className = "heart";
    h.textContent = "♥\uFE0E";
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = (12 + Math.random() * 26) + "px";
    h.style.color = colors[i % colors.length];
    h.style.animationDuration = (9 + Math.random() * 10) + "s";
    h.style.animationDelay = (Math.random() * 12) + "s";
    h.style.setProperty("--sway", (20 + Math.random() * 50) + "px");
    h.style.setProperty("--o", (0.25 + Math.random() * 0.4).toFixed(2));
    box.appendChild(h);
  }
})();

// Pétalos que caen con vaivén
(function () {
  const box = document.getElementById("hearts");
  const total = window.innerWidth < 600 ? 22 : 38;

  for (let i = 0; i < total; i++) {
    const p = document.createElement("span");
    const size = 9 + Math.random() * 12;
    p.className = "petal";
    p.style.left = Math.random() * 100 + "vw";
    p.style.width = size + "px";
    p.style.height = (size * 0.8) + "px";
    p.style.animationDuration = (7 + Math.random() * 8) + "s";
    p.style.animationDelay = (Math.random() * 10) + "s";
    p.style.setProperty("--sway", (40 + Math.random() * 90) + "px");
    p.style.setProperty("--o", (0.5 + Math.random() * 0.4).toFixed(2));
    // Cada vez que un pétalo vuelve a salir por arriba, lo hace desde otro punto
    p.addEventListener("animationiteration", function () {
      p.style.left = Math.random() * 100 + "vw";
    });
    box.appendChild(p);
  }
})();

// Tu número en formato internacional, sin "+", espacios ni guiones.
// Ejemplo para España: 34600123456
const MI_WHATSAPP = "34XXXXXXXXX";

// Fecha de hoy en hora local (formato YYYY-MM-DD)
function todayLocal() {
  const now = new Date();
  const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
  return local.toISOString().slice(0, 10);
}

// No permitir días pasados
const dayInput = document.getElementById("day");
const hoy = todayLocal();
// Solo se pueden elegir fechas de 2026 y 2027 (y ninguna que ya haya pasado)
dayInput.min = hoy < "2026-01-01" ? "2026-01-01" : hoy;
dayInput.max = "2027-12-31";

function sayYes() {
  document.getElementById("question").classList.add("hidden");
  document.getElementById("celebration").classList.remove("hidden");
  window.scrollTo(0, 0);
  document.getElementById("celebrationTitle").focus({ preventScroll: true });
  fireworks();
}

let noClicks = 0;
let noPlaceholder = null;
let yesShift = 0;
const NO_MAX = 3;
const noMessages = [
  "(Pruebe otra opción)",
  "(Error)",
  "(Error grave)"
];
let messageTimer = null;

function sayNo() {
  const noBtn = document.getElementById("noButton");
  const yesBtn = document.getElementById("yesButton");
  const message = document.getElementById("message");

  noClicks++;
  message.textContent = noMessages[Math.min(noClicks, noMessages.length) - 1];
  clearTimeout(messageTimer);
  messageTimer = setTimeout(() => { message.textContent = ""; }, 4000);

  // Primer clic: el No sale de su sitio (queda un hueco para que nada salte)
  if (noClicks === 1) {
    const r = noBtn.getBoundingClientRect();
    if (noBtn.offsetTop === yesBtn.offsetTop) {
      const gap = noBtn.offsetLeft - (yesBtn.offsetLeft + yesBtn.offsetWidth);
      yesShift = (noBtn.offsetWidth + gap) / 2;
    }
    noPlaceholder = document.createElement("span");
    noPlaceholder.style.cssText =
      "display:inline-block;visibility:hidden;margin:9px;width:" +
      noBtn.offsetWidth + "px;height:" + noBtn.offsetHeight + "px;";
    noBtn.parentNode.insertBefore(noPlaceholder, noBtn);
    noBtn.style.position = "fixed";
    noBtn.style.margin = "0";
    noBtn.style.left = r.left + "px";
    noBtn.style.top = r.top + "px";
    noBtn.style.zIndex = "5";
    void noBtn.offsetWidth;
    noBtn.style.transition =
      "transform 0.4s ease, left 0.5s ease, top 0.5s ease, filter 0.15s ease";
  }

  // El No salta a otro punto de la pantalla en cada clic y se encoge
  const w = noBtn.offsetWidth;
  const h = noBtn.offsetHeight;
  const maxX = Math.max(window.innerWidth - w - 16, 0);
  const maxY = Math.max(window.innerHeight - h - 72, 0);
  noBtn.style.left = (8 + Math.random() * maxX) + "px";
  noBtn.style.top = (48 + Math.random() * maxY) + "px";
  noBtn.style.transform = "scale(" + Math.max(1 - noClicks * 0.3, 0) + ")";

  // El Sí crece un poco y se acerca al centro
  const progress = noClicks / NO_MAX;
  yesBtn.style.transform =
    "translateX(" + (yesShift * progress) + "px) scale(" + (1 + noClicks * 0.15) + ")";

  // Tras el tercer clic el No desaparece y el Sí queda centrado
  if (noClicks >= NO_MAX) {
    noBtn.disabled = true;
    setTimeout(() => {
      noBtn.style.display = "none";
      if (noPlaceholder) noPlaceholder.remove();
      // Sin animación, para que el Sí no salte al cambiar el diseño
      yesBtn.style.transition = "none";
      yesBtn.style.transform = "scale(" + (1 + noClicks * 0.15) + ")";
      void yesBtn.offsetWidth;
      yesBtn.style.transition = "";
    }, 600);
  }
}

// Fuegos artificiales: muchas explosiones repartidas durante unos 6 segundos
function fireworks() {
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const DURATION = 6000;
  const BURSTS = reduced ? 6 : 24;
  const colors = ["#f3b6cf", "#ffffff", "#d77ca5", "#eaa6c1", "#ffd6e7", "#ffcf9f"];

  const canvas = document.createElement("canvas");
  canvas.setAttribute("aria-hidden", "true");
  canvas.style.cssText =
    "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50;";
  document.body.appendChild(canvas);
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  let W = 0, H = 0;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener("resize", resize);

  const sparks = [];

  function burst(x, y) {
    const color = colors[Math.floor(Math.random() * colors.length)];
    const count = 80 + Math.floor(Math.random() * 40);
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1.5 + Math.random() * 4.5;
      sparks.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.008 + Math.random() * 0.012,
        size: 1.5 + Math.random() * 1.8,
        color: Math.random() < 0.25 ? "#ffffff" : color
      });
    }
  }

  // Las explosiones se reparten en los primeros ~4,5 s; las chispas tardan ~1,5 s en apagarse
  for (let i = 0; i < BURSTS; i++) {
    const delay = (i / BURSTS) * (DURATION - 1500) + Math.random() * 200;
    setTimeout(function () {
      burst(W * (0.1 + Math.random() * 0.8), H * (0.1 + Math.random() * 0.5));
    }, delay);
  }

  const start = performance.now();

  function frame(now) {
    // Desvanece el cuadro anterior para dejar una estela
    ctx.globalCompositeOperation = "destination-out";
    ctx.fillStyle = "rgba(0, 0, 0, 0.22)";
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";

    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.vx *= 0.985;
      s.vy = s.vy * 0.985 + 0.035;
      s.x += s.vx;
      s.y += s.vy;
      s.life -= s.decay;
      if (s.life <= 0) {
        sparks.splice(i, 1);
        continue;
      }
      ctx.globalAlpha = s.life;
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (now - start < DURATION || sparks.length > 0) {
      requestAnimationFrame(frame);
    } else {
      window.removeEventListener("resize", resize);
      canvas.remove();
    }
  }
  requestAnimationFrame(frame);
}

function saveDate() {
  const confirmation = document.getElementById("confirmation");
  const day = document.getElementById("day").value;
  const hour = document.getElementById("hour").value;

  if (!day || !hour) {
    confirmation.textContent = "Elige un día y una hora primero 🤍";
    return;
  }

  const nota = document.getElementById("note").value.trim();
  if (!nota) {
    confirmation.textContent = "Escríbeme algo en el mensaje primero 🤍";
    document.getElementById("note").focus();
    return;
  }

  // Por si escribe la fecha a mano: solo valen 2026 y 2027
  const anio = Number(day.slice(0, 4));
  if (anio < 2026 || anio > 2027) {
    confirmation.textContent = "Elige una fecha de 2026 o 2027 🤍";
    return;
  }

  const chosen = new Date(day + "T" + hour);
  if (chosen < new Date()) {
    confirmation.textContent = "Elige un momento que todavía no haya pasado 🤍";
    return;
  }

  try {
    localStorage.setItem("chosenDay", day);
    localStorage.setItem("chosenHour", hour);
  } catch (e) {}

  const texto = chosen.toLocaleString("es-ES", {
    weekday: "long",
    day: "numeric",
    month: "long",
    hour: "2-digit",
    minute: "2-digit"
  });

  const mensaje = "¡Dije que sí! 🤍 Quedemos el " + texto + "\n\n" + nota;
  const url = "https://wa.me/" + MI_WHATSAPP +
              "?text=" + encodeURIComponent(mensaje);

  confirmation.textContent = "";
  document.getElementById("celebration").classList.add("hidden");
  document.getElementById("thanks").classList.remove("hidden");
  window.scrollTo(0, 0);
  document.getElementById("thanksTitle").focus({ preventScroll: true });
  setTimeout(() => { window.location.href = url; }, 2000);
}
